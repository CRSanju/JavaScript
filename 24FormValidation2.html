<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
  </head>
  <body>
    <h1>Registration Form</h1>
    <form id="registrationForm">
      <label for="username">Username:</label>
      <input type="text" id="username"required oninput="toUpperCaseInput(this)"
      /><br /><br />

      <label for="email">Email:</label>
      <input type="email" id="email" required /><br /><br />

      <label for="password">Password:</label>
      <input type="password" id="password" required /><br /><br />

      <label for="phone">Phone no:</label>
      <input type="tel" id="phone" required /><br /><br />

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>

    <script>
      function toUpperCaseInput(input) {
        input.value = input.value.toUpperCase();
      }

      const form = document.getElementById("registrationForm");
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const phone = document.getElementById("phone").value.trim();

        // Regex patterns
        const usernameRegex = /^[A-Z]{2,100}$/;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const passwordRegex =
          /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)[A-Za-z\d@$!%*?&]{8,}$/;
        const phoneRegex = /^\d{10}$/;

        // Validate username
        if (!username) {
          alert("Username is required");
        }
        if (username.length < 2 || username.length > 100) {
          alert("Username must be 2-100 characters");
        }
        if (!usernameRegex.test(username)) {
          alert("Username must contain only alphabets");
        }

        // Validate email
        if (!emailRegex.test(email)) {
          alert("Please enter a valid email address");
        }

        // Validate password
        if (!passwordRegex.test(password)) {
          alert(
            "Password must be 8+ chars with uppercase, lowercase, digit, and special char",
          );
        }

        // Validate phone
        if (!phoneRegex.test(phone)) {
          alert("Phone must be exactly 10 digits");
        }

        alert("Form validated successfully! Registration complete.");
      });
    </script>
  </body>
</html>
