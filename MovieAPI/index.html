<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie page</title>
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- LOGIN PAGE -->
    <div class="login-container" id="loginpage">
      <h2>Movie Login 🎬</h2>

      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      />

      <input type="submit" value="Login" onclick="login()" />
      <p id="errorMsg"></p>
    </div>

    <!-- MOVIE PAGE -->
    <div id="moviePage">
      <h1>🎥 Movie Search</h1>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search your favorite movie..."
        />
        <button onclick="searchMovies()">Search</button>
      </div>

      <ul id="movieList"></ul>
    </div>

    <script>
      const apiKey = "9ec073d5";

      //login page
      async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorMsg = document.getElementById("errorMsg");

        try {
          const res = await fetch("users.json");
          const users = await res.json();

          const user = users.find(
            (u) => u.email === email && u.password === password,
          );

          if (user) {
            document.getElementById("loginpage").style.display = "none";
            document.getElementById("moviePage").style.display = "block";
          } else {
            errorMsg.textContent = "❌ Invalid email or password";
          }
        } catch (err) {
          console.log("Error loading users.json:", err);
        }
      }

      // Movie page
      async function searchMovies() {
        const searchTerm = document.getElementById("searchInput").value.trim();
        const apiUrl = `https://www.omdbapi.com/?apikey=${apiKey}&s=${searchTerm}`;

        try {
          const response = await fetch(apiUrl);
          const data = await response.json();

          const movieList = document.getElementById("movieList");
          movieList.innerHTML = "";

          if (data.Response === "True") {
            data.Search.forEach((movie) => {
              const li = document.createElement("li");
              li.classList.add("movie-card");

              li.innerHTML = `
          <img src="${movie.Poster !== "N/A" ? movie.Poster : "https://via.placeholder.com/200x300?text=No+Image"}">
          <h3>${movie.Title}</h3>
          <p>Year: ${movie.Year}</p>
        `;

              movieList.appendChild(li);
            });
          } else {
            movieList.innerHTML = `<li>No movies found 😢</li>`;
          }
        } catch (error) {
          console.error("Error fetching movies:", error);
        }
      }
    </script>
  </body>
</html>
